<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFito Test Runner</title>
  
  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS v3 (Local) -->
  <script src="./js/lib/tailwind.js"></script>
  
  <!-- Lucide Icons (Local) -->
  <script src="./js/lib/lucide.min.js"></script>
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #09090b;
      color: #fafafa;
    }
  </style>
</head>
<body class="bg-[#09090b] text-[#fafafa]">

  <div class="max-w-2xl w-full space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-600 flex items-center justify-center shadow-lg">
          <i data-lucide="shield-alert" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white leading-tight">PDFito Test Suite</h1>
          <p class="text-xs text-neutral-500">Pruebas unitarias de las utilidades lógicas de procesamiento y almacenamiento.</p>
        </div>
      </div>
      <a href="./index.html" class="inline-flex items-center gap-1 text-xs font-semibold text-neutral-400 hover:text-white transition-all">
        Volver a la App
        <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      </a>
    </div>

    <!-- Summary Box -->
    <div id="summary-box" class="p-5 rounded-2xl border border-zinc-800 bg-zinc-900/60 flex items-center justify-between">
      <div class="text-left space-y-1">
        <span class="text-[10px] uppercase font-bold tracking-wider text-neutral-500">Estado general</span>
        <h3 class="text-lg font-bold" id="suite-status">Ejecutando pruebas...</h3>
      </div>
      <div class="flex gap-4 text-center">
        <div class="px-3 py-1 bg-zinc-950 border border-zinc-800 rounded-xl">
          <div class="text-lg font-bold text-emerald-400" id="passed-count">0</div>
          <div class="text-[9px] text-neutral-500 font-bold uppercase tracking-wider">Pasadas</div>
        </div>
        <div class="px-3 py-1 bg-zinc-950 border border-zinc-800 rounded-xl">
          <div class="text-lg font-bold text-rose-400" id="failed-count">0</div>
          <div class="text-[9px] text-neutral-500 font-bold uppercase tracking-wider">Fallidas</div>
        </div>
      </div>
    </div>

    <!-- Tests List -->
    <div id="tests-list" class="space-y-3">
      <!-- Dynamically filled -->
      <div class="text-center text-neutral-500 text-xs py-8">
        Esperando ejecución de suite...
      </div>
    </div>
  </div>

  <script type="module">
    import { TestRunner } from './js/utils/testRunner.js';

    // Execute tests
    const results = TestRunner.run();

    // Render results
    const list = document.getElementById('tests-list');
    const statusText = document.getElementById('suite-status');
    const passCount = document.getElementById('passed-count');
    const failCount = document.getElementById('failed-count');

    let passed = 0;
    let failed = 0;

    list.innerHTML = results.map(res => {
      if (res.passed) {
        passed++;
        return `
          <div class="flex items-center justify-between p-4 rounded-xl bg-zinc-900/40 border border-emerald-500/10">
            <div class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center">
                <i data-lucide="check" class="w-3.5 h-3.5"></i>
              </span>
              <span class="text-sm font-semibold text-neutral-200">${res.name}</span>
            </div>
            <span class="px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[9px] font-bold text-emerald-400 uppercase tracking-wide">Éxito</span>
          </div>
        `;
      } else {
        failed++;
        return `
          <div class="flex flex-col gap-2 p-4 rounded-xl bg-zinc-900/40 border border-rose-500/10">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-6 h-6 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </span>
                <span class="text-sm font-semibold text-neutral-200">${res.name}</span>
              </div>
              <span class="px-2 py-0.5 rounded-full bg-rose-500/10 border border-rose-500/20 text-[9px] font-bold text-rose-400 uppercase tracking-wide">Fallo</span>
            </div>
            <p class="text-xs font-mono text-rose-400/80 bg-rose-950/20 border border-rose-950 p-2.5 rounded-lg ml-9">${res.error}</p>
          </div>
        `;
      }
    }).join('');

    passCount.textContent = passed;
    failCount.textContent = failed;

    if (failed === 0) {
      statusText.innerHTML = `<span class="text-emerald-400">¡Todas las pruebas pasaron con éxito!</span>`;
    } else {
      statusText.innerHTML = `<span class="text-rose-400">Hay ${failed} prueba(s) fallida(s).</span>`;
    }

    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
